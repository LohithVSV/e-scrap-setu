<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Setu | Collection Register</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-primary:#0D1B14; --bg-panel:#142A1F; --bg-panel-light:#1B3527;
    --accent-copper:#C9A227; --accent-teal:#3E8E8E;
    --text-primary:#EDEAE0; --text-muted:#8FA79C; --alert:#C1503F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg-primary); color:var(--text-primary); font-family:'Inter',sans-serif; padding-bottom:40px;}

  header{
    padding:20px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid var(--bg-panel-light);
  }
  header .title h1{font-family:'Space Grotesk',sans-serif; font-size:17px;}
  header .title span{font-size:12px; color:var(--text-muted);}
  .logout-btn{background:none; border:1px solid var(--bg-panel-light); color:var(--text-muted); padding:6px 12px; border-radius:8px; font-size:11px; cursor:pointer;}

  main{padding:20px;}
  .tabs{display:flex; gap:8px; margin-bottom:20px;}
  .tab{
    flex:1; text-align:center; padding:10px; background:var(--bg-panel); border:1px solid var(--bg-panel-light);
    border-radius:10px; font-size:12px; font-weight:600; cursor:pointer; color:var(--text-muted);
  }
  .tab.active{border-color:var(--accent-copper); color:var(--accent-copper);}

  .section{display:none;}
  .section.active{display:block;}

  .pending-card{
    background:var(--bg-panel); border:1px solid var(--accent-copper); border-radius:14px;
    padding:16px 18px; margin-bottom:12px;
  }
  .pending-card .row{display:flex; justify-content:space-between; margin-bottom:6px;}
  .pending-card .name{font-size:14px; font-weight:600;}
  .pending-card .meta{font-size:11px; color:var(--text-muted);}
  .pending-card .weight{font-family:'JetBrains Mono',monospace; color:var(--accent-copper); font-size:13px;}
  .confirm-btn{
    width:100%; margin-top:10px; padding:10px; background:var(--accent-copper); color:var(--bg-primary);
    border:none; border-radius:8px; font-weight:700; font-size:12px; cursor:pointer;
  }
  .empty-state{color:var(--text-muted); font-size:13px; text-align:center; padding:30px 0;}

  .form-row{margin-bottom:14px;}
  .form-row label{font-size:12px; color:var(--text-muted); display:block; margin-bottom:6px;}
  .form-row select, .form-row input{
    width:100%; padding:10px 12px; background:var(--bg-panel); color:var(--text-primary);
    border:1px solid var(--bg-panel-light); border-radius:8px; font-size:14px;
  }
  .submit-btn{
    width:100%; padding:14px; background:var(--accent-teal); color:var(--bg-primary);
    border:none; border-radius:10px; font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:14px; cursor:pointer; margin-top:8px;
  }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--bg-panel); border:1px solid var(--accent-teal); padding:12px 20px;
    border-radius:10px; font-size:13px; display:none;
  }
  .toast.show{display:block;}
</style>
</head>
<body>

<header>
  <div class="title">
    <h1>Collection Register</h1>
    <span id="officerMeta">Loading...</span>
  </div>
  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<main>
  <div class="tabs">
    <div class="tab active" data-tab="pending">Pending Scans</div>
    <div class="tab" data-tab="manual">Log Manually</div>
  </div>

  <div class="section active" id="pendingSection">
    <div id="pendingList"><div class="empty-state">Loading pending drop-offs...</div></div>
  </div>

  <div class="section" id="manualSection">
    <div class="form-row">
      <label>Drop-off point</label>
      <select id="dropoffSelect"></select>
    </div>
    <div class="form-row">
      <label>Item type</label>
      <select id="itemType">
        <option>Mobile / small electronics</option>
        <option>Cables / chargers</option>
        <option>Router / networking gear</option>
        <option>Batteries</option>
        <option>Other e-waste</option>
      </select>
    </div>
    <div class="form-row">
      <label>Weight (kg)</label>
      <input type="number" id="weightInput" step="0.1">
    </div>
    <button class="submit-btn" onclick="submitManual()">Log Collection</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="../../js/api.js"></script>
<script>
if(!localStorage.getItem('esetu_token')){
  window.location.href = 'login.html';
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab + 'Section').classList.add('active');
  });
});

function logout(){
  localStorage.clear();
  window.location.href = 'login.html';
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function loadPending(){
  const role = localStorage.getItem('esetu_role');
  const ward = localStorage.getItem('esetu_ward');
  document.getElementById('officerMeta').textContent = `${role.replace('_',' ')} ${ward ? '· ' + ward + ' Ward' : ''}`;

  try{
    const all = await getWardCollections(ward || '');
    const pending = (all || []).filter(c => c.status === 'pending_officer_confirmation');
    const list = document.getElementById('pendingList');

    if(pending.length === 0){
      list.innerHTML = '<div class="empty-state">No pending drop-offs right now</div>';
      return;
    }
    list.innerHTML = pending.map(p => `
      <div class="pending-card">
        <div class="row">
          <span class="name">${p.citizen_name || 'Citizen'}</span>
          <span class="weight">${p.weight_kg} kg</span>
        </div>
        <div class="meta">${p.item_type || 'E-waste'} · ${p.dropoff_point_name || ''}</div>
        <button class="confirm-btn" onclick="confirmCollection(${p.id})">Confirm & Award Credits</button>
      </div>
    `).join('');
  }catch(e){
    document.getElementById('pendingList').innerHTML = '<div class="empty-state">Could not load pending drop-offs.</div>';
  }
}

async function confirmCollection(id){
  try{
    await logCollection({ id, status: 'confirmed' });
    showToast('Confirmed — credits awarded to citizen.');
    loadPending();
  }catch(e){
    showToast('Confirmation failed. Try again.');
  }
}

async function populateDropoffs(){
  try{
    const dropoffs = await getDropoffs();
    document.getElementById('dropoffSelect').innerHTML = dropoffs.map(d =>
      `<option value="${d.id}">${d.name} (${d.ward})</option>`
    ).join('');
  }catch(e){}
}

async function submitManual(){
  const dropoff_point_id = document.getElementById('dropoffSelect').value;
  const item_type = document.getElementById('itemType').value;
  const weight_kg = parseFloat(document.getElementById('weightInput').value);
  if(!weight_kg || weight_kg <= 0){
    showToast('Enter a valid weight.');
    return;
  }
  try{
    await logCollection({ dropoff_point_id, weight_kg, item_type, status: 'confirmed' });
    showToast('Collection logged.');
    document.getElementById('weightInput').value = '';
  }catch(e){
    showToast('Failed to log collection.');
  }
}

loadPending();
populateDropoffs();
</script>
</body>
</html>
