<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Setu | Official Login</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-primary:#0D1B14; --bg-panel:#142A1F; --bg-panel-light:#1B3527;
    --accent-copper:#C9A227; --accent-teal:#3E8E8E;
    --text-primary:#EDEAE0; --text-muted:#8FA79C; --alert:#C1503F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg-primary); color:var(--text-primary); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    width:100%; max-width:380px; background:var(--bg-panel); border:1px solid var(--bg-panel-light);
    border-radius:18px; padding:32px 28px;
  }
  .logo{font-family:'Space Grotesk',sans-serif; font-size:22px; color:var(--accent-copper); font-weight:700; margin-bottom:4px;}
  .subtitle{font-size:12px; color:var(--text-muted); margin-bottom:28px;}

  .form-row{margin-bottom:16px;}
  .form-row label{font-size:12px; color:var(--text-muted); display:block; margin-bottom:6px;}
  .form-row input{
    width:100%; padding:12px 14px; background:var(--bg-primary); color:var(--text-primary);
    border:1px solid var(--bg-panel-light); border-radius:8px; font-size:14px; font-family:'Inter',sans-serif;
  }
  .form-row input:focus{outline:none; border-color:var(--accent-teal);}

  .login-btn{
    width:100%; padding:14px; background:var(--accent-copper); color:var(--bg-primary);
    border:none; border-radius:10px; font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:14px; cursor:pointer; margin-top:8px;
  }
  .login-btn:disabled{opacity:0.5;}

  .error-msg{
    display:none; background:rgba(193,80,63,0.12); border:1px solid var(--alert); color:var(--alert);
    border-radius:8px; padding:10px 12px; font-size:12px; margin-bottom:16px;
  }
  .error-msg.show{display:block;}

  .back-link{display:block; text-align:center; margin-top:20px; color:var(--text-muted); font-size:12px; text-decoration:none;}
</style>
</head>
<body>

<div class="card">
  <div class="logo">E-SETU</div>
  <div class="subtitle">Official portal — Field Officer, Supervisor, Zonal Officer, Commissioner</div>

  <div class="error-msg" id="errorMsg"></div>

  <form id="loginForm">
    <div class="form-row">
      <label>Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="form-row">
      <label>Password</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
  </form>

  <a href="../../index.html" class="back-link">← Back to E-Setu home</a>
</div>

<script src="../../js/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errorEl = document.getElementById('errorMsg');
  errorEl.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Signing in...';

  try{
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const res = await loginOfficer({ email, password });

    // Expects api.js loginOfficer() to return { access_token, role, ward }
    localStorage.setItem('esetu_token', res.access_token);
    localStorage.setItem('esetu_role', res.role);
    localStorage.setItem('esetu_ward', res.ward || '');

    // Route by role — field officers/supervisors go to the ops screen,
    // zonal/commissioner go straight to the dashboard.
    if(res.role === 'field_officer' || res.role === 'supervisor'){
      window.location.href = 'collect.html';
    } else {
      window.location.href = 'dashboard.html';
    }
  }catch(err){
    errorEl.textContent = 'Invalid email or password.';
    errorEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});
</script>
</body>
</html>
