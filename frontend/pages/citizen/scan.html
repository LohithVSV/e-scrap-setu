<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Setu | Scan QR</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg-primary:#0D1B14; --bg-panel:#142A1F; --bg-panel-light:#1B3527;
    --accent-copper:#C9A227; --accent-teal:#3E8E8E;
    --text-primary:#EDEAE0; --text-muted:#8FA79C; --alert:#C1503F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg-primary); color:var(--text-primary); font-family:'Inter',sans-serif; padding-bottom:40px;}
  header{padding:20px; text-align:center;}
  header h1{font-family:'Space Grotesk',sans-serif; font-size:18px;}
  header p{font-size:13px; color:var(--text-muted); margin-top:4px;}

  #reader{
    width:90%; max-width:360px; margin:20px auto; border-radius:16px; overflow:hidden;
    border:2px solid var(--accent-teal);
  }

  .manual-entry{
    max-width:360px; margin:16px auto; padding:0 20px; text-align:center;
  }
  .manual-entry a{color:var(--accent-teal); font-size:12px; text-decoration:underline;}

  .result-card{
    display:none; max-width:360px; margin:20px auto; background:var(--bg-panel);
    border:1px solid var(--bg-panel-light); border-radius:16px; padding:22px;
  }
  .result-card.show{display:block;}
  .result-card .name{font-family:'Space Grotesk',sans-serif; font-size:18px; margin-bottom:4px;}
  .result-card .ward{font-size:13px; color:var(--text-muted); margin-bottom:16px;}

  .form-row{margin-bottom:14px;}
  .form-row label{font-size:12px; color:var(--text-muted); display:block; margin-bottom:6px;}
  .form-row select, .form-row input{
    width:100%; padding:10px 12px; background:var(--bg-primary); color:var(--text-primary);
    border:1px solid var(--bg-panel-light); border-radius:8px; font-family:'Inter',sans-serif; font-size:14px;
  }
  .submit-btn{
    width:100%; padding:14px; background:var(--accent-copper); color:var(--bg-primary);
    border:none; border-radius:10px; font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:14px; cursor:pointer; margin-top:8px;
  }
  .submit-btn:disabled{opacity:0.5;}

  .status-msg{
    display:none; max-width:360px; margin:20px auto; text-align:center; padding:16px;
    border-radius:12px; font-size:13px;
  }
  .status-msg.show{display:block;}
  .status-msg.pending{background:rgba(201,162,39,0.12); color:var(--accent-copper); border:1px solid var(--accent-copper);}
  .status-msg.error{background:rgba(193,80,63,0.12); color:var(--alert); border:1px solid var(--alert);}

  .back-link{display:block; text-align:center; margin-top:24px; color:var(--text-muted); font-size:13px; text-decoration:none;}
</style>
</head>
<body>

<header>
  <h1>Scan Drop-off QR</h1>
  <p>Point your camera at the QR code on the drop-off bin</p>
</header>

<div id="reader"></div>
<div class="manual-entry"><a href="#" id="manualLink">Or enter code manually</a></div>

<div class="result-card" id="resultCard">
  <div class="name" id="dropoffName"></div>
  <div class="ward" id="dropoffWard"></div>

  <div class="form-row">
    <label>Item type</label>
    <select id="itemType">
      <option>Mobile / small electronics</option>
      <option>Cables / chargers</option>
      <option>Router / networking gear</option>
      <option>Batteries</option>
      <option>Other e-waste</option>
    </select>
  </div>
  <div class="form-row">
    <label>Approx. weight (kg)</label>
    <input type="number" id="weightInput" step="0.1" placeholder="e.g. 1.5">
  </div>
  <button class="submit-btn" id="submitBtn">Confirm Drop-off</button>
</div>

<div class="status-msg" id="statusMsg"></div>

<a href="home.html" class="back-link">← Back to Home</a>

<script src="../../js/api.js"></script>
<script>
let currentQR = null;

function showResult(qrCode, dropoff){
  currentQR = qrCode;
  document.getElementById('dropoffName').textContent = dropoff.name;
  document.getElementById('dropoffWard').textContent = dropoff.ward + ' Ward';
  document.getElementById('resultCard').classList.add('show');
  document.getElementById('reader').style.display = 'none';
}

function showStatus(type, msg){
  const el = document.getElementById('statusMsg');
  el.className = 'status-msg show ' + type;
  el.textContent = msg;
}

async function onScanSuccess(decodedText){
  html5QrcodeScanner.pause();
  try{
    const dropoff = await getDropoffByQR(decodedText);
    showResult(decodedText, dropoff);
  }catch(e){
    showStatus('error', 'QR code not recognized. Try again or enter manually.');
    setTimeout(() => html5QrcodeScanner.resume(), 2000);
  }
}

const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 240 });
html5QrcodeScanner.render(onScanSuccess);

document.getElementById('manualLink').addEventListener('click', async (e) => {
  e.preventDefault();
  const code = prompt('Enter the drop-off point code:');
  if(!code) return;
  try{
    const dropoff = await getDropoffByQR(code);
    showResult(code, dropoff);
  }catch(err){
    showStatus('error', 'Code not found.');
  }
});

document.getElementById('submitBtn').addEventListener('click', async () => {
  const weight = parseFloat(document.getElementById('weightInput').value);
  const itemType = document.getElementById('itemType').value;
  if(!weight || weight <= 0){
    showStatus('error', 'Enter a valid weight.');
    return;
  }
  document.getElementById('submitBtn').disabled = true;
  try{
    const citizenId = Number(localStorage.getItem('esetu_citizen_id'));
    const dropoff = await getDropoffByQR(currentQR);
    await logCollection({
      dropoff_point_id: dropoff.id,
      citizen_id: citizenId || null,
      weight_kg: weight,
      item_type: itemType,
      status: 'pending_officer_confirmation'
    });
    document.getElementById('resultCard').classList.remove('show');
    showStatus('pending', 'Drop-off logged! Show this screen to the field officer to confirm and receive your Green Credits.');
  }catch(e){
    showStatus('error', 'Something went wrong. Try again.');
    document.getElementById('submitBtn').disabled = false;
  }
});
</script>
</body>
</html>
