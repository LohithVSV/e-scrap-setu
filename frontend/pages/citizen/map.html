<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find a Drop-off — E-Setu</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0D1B14; --bg-panel: #142A1F; --bg-panel-light: #1B3527;
    --accent-copper: #C9A227; --accent-teal: #3E8E8E;
    --text-primary: #EDEAE0; --text-muted: #8FA79C; --alert: #C1503F;
    --line: rgba(237,234,224,0.1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--bg-panel);
  }
  header a { color: var(--text-muted); font-size: 14px; text-decoration: none; }
  header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 18px; }

  .layout { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 57px); }

  #sidebar { background: var(--bg-panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 16px; }
  #search { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg-panel-light); color: var(--text-primary); font-size: 14px; margin-bottom: 14px; }
  #locate-btn {
    width: 100%; padding: 10px; margin-bottom: 16px; background: var(--accent-copper); color: #0D1B14;
    border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;
  }

  .dropoff-card {
    background: var(--bg-panel-light); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.2s;
  }
  .dropoff-card:hover { border-color: var(--accent-copper); }
  .dropoff-card h3 { font-size: 14px; margin-bottom: 4px; }
  .dropoff-card p { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .load-bar { height: 5px; background: var(--bg-primary); border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
  .load-fill { height: 100%; background: var(--accent-teal); }
  .load-fill.high { background: var(--alert); }
  .load-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); }

  #map { width: 100%; height: 100%; }

  .leaflet-popup-content-wrapper { background: var(--bg-panel-light); color: var(--text-primary); border-radius: 8px; }
  .leaflet-popup-tip { background: var(--bg-panel-light); }
  .popup-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; margin-bottom: 4px; }
  .popup-ward { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .popup-btn { background: var(--accent-copper); color: #0D1B14; border: none; padding: 6px 12px;
    border-radius: 5px; font-size: 12px; font-weight: 600; cursor: pointer; }

  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: 40% 60%; }
  }
</style>
</head>
<body>

<header>
  <h1>📍 Find a Drop-off</h1>
  <a href="../../index.html">← Back home</a>
</header>

<div class="layout">
  <div id="sidebar">
    <input id="search" type="text" placeholder="Search by ward or area...">
    <button id="locate-btn" onclick="locateMe()">📍 Use my location</button>
    <div id="dropoff-list"></div>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Centered on Visakhapatnam — swap coords if your pilot wards differ
  const map = L.map('map').setView([17.6868, 83.2185], 12);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    maxZoom: 19
  }).addTo(map);

  // MOCK DATA — replace with: const dropoffs = await getDropoffs(); from api.js once backend is live
  const dropoffs = [
    { id: 1, name: "MVP Colony Collection Point", ward: "Ward 12", lat: 17.7231, lng: 83.3238, loadPct: 40 },
    { id: 2, name: "Dwaraka Nagar Drop-off", ward: "Ward 5", lat: 17.7266, lng: 83.3040, loadPct: 82 },
    { id: 3, name: "Gajuwaka Municipal Point", ward: "Ward 27", lat: 17.6868, lng: 83.2000, loadPct: 25 },
    { id: 4, name: "Seethammadhara Point", ward: "Ward 8", lat: 17.7395, lng: 83.3167, loadPct: 60 },
    { id: 5, name: "Pendurthi Ward Office", ward: "Ward 30", lat: 17.7833, lng: 83.2333, loadPct: 15 },
  ];

  const markers = {};

  function renderList(data) {
    const list = document.getElementById('dropoff-list');
    list.innerHTML = '';
    data.forEach(d => {
      const highLoad = d.loadPct >= 75;
      const card = document.createElement('div');
      card.className = 'dropoff-card';
      card.innerHTML = `
        <h3>${d.name}</h3>
        <p>${d.ward}</p>
        <div class="load-bar"><div class="load-fill ${highLoad ? 'high' : ''}" style="width:${d.loadPct}%"></div></div>
        <div class="load-label">${d.loadPct}% full${highLoad ? ' · nearly full' : ''}</div>
      `;
      card.onclick = () => {
        map.flyTo([d.lat, d.lng], 15);
        markers[d.id].openPopup();
      };
      list.appendChild(card);
    });
  }

  dropoffs.forEach(d => {
    const highLoad = d.loadPct >= 75;
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:16px;height:16px;border-radius:50%;
        background:${highLoad ? '#C1503F' : '#C9A227'};
        border:2px solid #0D1B14; box-shadow:0 0 8px ${highLoad ? '#C1503F' : '#C9A227'}"></div>`,
      iconSize: [16, 16]
    });

    const marker = L.marker([d.lat, d.lng], { icon }).addTo(map);
    marker.bindPopup(`
      <div class="popup-title">${d.name}</div>
      <div class="popup-ward">${d.ward} · ${d.loadPct}% full</div>
      <button class="popup-btn" onclick="alert('Scan QR at this point to deposit')">Get directions</button>
    `);
    markers[d.id] = marker;
  });

  renderList(dropoffs);

  document.getElementById('search').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    renderList(dropoffs.filter(d => d.name.toLowerCase().includes(q) || d.ward.toLowerCase().includes(q)));
  });

  function locateMe() {
    if (!navigator.geolocation) return alert('Geolocation not supported on this device');
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        map.flyTo([latitude, longitude], 14);
        L.marker([latitude, longitude]).addTo(map).bindPopup("You are here").openPopup();
      },
      () => alert('Could not get your location — check permissions')
    );
  }
</script>

</body>
</html>
